name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Auth Service Image
      - name: Build Auth Service Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/auth-service:latest ./auth-service

      - name: Push Auth Service Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:latest

      # Build Nginx Image
      - name: Build Nginx Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/nginx-app:latest ./auth-service/nginx

      - name: Push Nginx Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/nginx-app:latest