<!DOCTYPE html>
<html>

<head>
    <title>DevOps Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="card">
            <h1>DevOps Task Manager</h1>

            <div class="section">
                <h3>Register</h3>
                <input id="regUser" placeholder="Username">
                <input id="regPass" placeholder="Password" type="password">
                <button onclick="register()">Register</button>
            </div>

            <div class="section">
                <h3>Login</h3>
                <input id="logUser" placeholder="Username">
                <input id="logPass" placeholder="Password" type="password">
                <button onclick="login()">Login</button>
            </div>

            <div id="result"></div>
        </div>
    </div>

    <script>
        async function register() {
            const username = document.getElementById("regUser").value;
            const password = document.getElementById("regPass").value;

            const res = await fetch("/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            document.getElementById("result").innerText = data.message || data.error;
        }

        async function login() {
            const username = document.getElementById("logUser").value;
            const password = document.getElementById("logPass").value;

            const res = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();

            if (res.ok) {
                localStorage.setItem("token", data.token);
                window.location.href = "/home.html";
            } else {
                document.getElementById("result").innerText = data.error;
            }
        }
    </script>

</body>

</html>
