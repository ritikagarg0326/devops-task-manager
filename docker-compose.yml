version: "3.9"

services:

  mongo:
    image: mongo:latest
    container_name: mongo
    volumes:
      - mongo_data:/data/db

  auth-service:
    build: .
    container_name: auth-service
    env_file:
      - .env
    depends_on:
      - mongo
    restart: always

  nginx:
    image: nginx:latest 
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - auth-service

volumes:
  mongo_data:
